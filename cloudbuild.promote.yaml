# ─────────────────────────────────────────────────────────────────────────────
# Karos CMO — promote a prep-built image to production. No rebuild from
# source: copies the exact image already built + deployed to prep (tagged
# with the git commit SHA) into this project's own Artifact Registry, then
# deploys that same image to Cloud Run. Production always runs the identical
# bits that were verified in prep.
#
# Invoked by .github/workflows/promote-production.yml:
#   gcloud builds submit --project=<PROD_PROJECT_ID> --config=cloudbuild.promote.yaml \
#     --no-source --substitutions=_PREP_PROJECT_ID=...,_SHA=<commit-sha>,...
#
# One-time setup — grant *this* (production) project's Cloud Build service
# account read access to the *prep* project's Artifact Registry repo, so the
# pull-from-prep step below can reach it:
#
#   PROD_PROJECT_NUMBER=$(gcloud projects describe $PROD_PROJECT_ID --format='value(projectNumber)')
#   gcloud artifacts repositories add-iam-policy-binding karos-cmo \
#     --project=$PREP_PROJECT_ID --location=us-central1 \
#     --member="serviceAccount:${PROD_PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#     --role="roles/artifactregistry.reader"
#
# The cloud-run-deploy step's flags (--set-secrets, --memory, etc.) mirror
# cloudbuild.yaml's own deploy step — keep the two in sync.
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  _REGION: us-central1
  _REPO: karos-cmo
  _SERVICE: karos-cmo
  _PREP_PROJECT_ID: ""
  _PREP_REGION: us-central1
  _SHA: ""
  _APP_URL: ""
  _AGENT_SERVICE_URL: ""
  _EMAIL_FROM: "Karos Labs <donotreply@karoslabs.com>"
  _ADMIN_EMAIL: "hello@karoslabs.com"
  # Failure-alert on-call list (job-alerts.ts) — separate from _ADMIN_EMAIL
  # above (support/signup mail). Keep in sync with cloudbuild.yaml's own copy.
  _ADMIN_EMAILS: "hello@karoslabs.com"
  # Runway autopilot — turned OFF 2026-08-10 after an unrelated agent-service
  # Anthropic credit exhaustion made its normal weekly top-up dispatch as a
  # wall of failed jobs with no advance visibility on the portal (it fires
  # immediately on a deficit, never as a schedule row). Route still measures
  # and reports deficits either way; flip back to "1" to resume auto-dispatch.
  _RUNWAY_AUTOGEN_ENABLED: "0"
  _RUNWAY_MAX_JOBS_PER_CLIENT: "14"
  # Task Map autopilot (src/app/api/tasks/auto-generate) — off by default.
  _TASKMAP_AUTOGEN_ENABLED: "0"
  _TASKMAP_AUTOGEN_SWEEP_CAP: "3"
  # The rest of these existed as literal env vars / Secret Manager refs on the
  # production Cloud Run service from its Cloud Run-native-CD days, discovered
  # via `gcloud run revisions describe` after a promote deploy wiped them (see
  # 2026-07-31 incident — gcloud run deploy --set-secrets/--set-env-vars
  # REPLACE the full set, they don't merge with whatever's already there).
  # All the underlying secrets already exist in this (production) project's
  # Secret Manager; this file just wasn't referencing them.
  _ANALYTICS_LIVE_INGEST: "1"
  _GCS_MEDIA_BUCKET: "karos-media-assets"
  # Agent-service webhook callback target — a stable Cloud Run URL for this
  # service, independent of _APP_URL/custom domain. Do not derive this from
  # _APP_URL; it must stay exactly what agent-service is configured to call.
  _AGENT_SERVICE_CALLBACK_URL: "https://karos-cmo-zc6vfwnzsq-ew.a.run.app"
  # Named Firestore database — production uses the project's default; prep
  # has its own isolated "prep" database (see cloudbuild.yaml). Explicit here
  # for symmetry with cloudbuild.yaml's parameterization.
  _FIRESTORE_DATABASE_ID: "(default)"
  # agent-engine dispatch. This was live on the running production revision but
  # in no deploy config, so the next promote through this file would have
  # turned it off — --set-env-vars replaces the entire set, the same shape as
  # the 2026-07-31 incident noted above.
  _AGENT_ENGINE_DISPATCH_ENABLED: "true"
  # Control-plane dispatch, now that agent-middleware is deployed in karoscmo
  # (europe-west1). These are PRODUCTION's own middleware and must never be
  # pointed at prep's, which resolves prompts and templates from prep's
  # Firestore — a production job answered by prep's control plane would run
  # against prompts nobody reviewed for production.
  #
  # The audience is the project-number URL form because that is exactly what
  # the service's own AUTH_AUDIENCE is set to. Cloud Run answers on two URL
  # forms and the middleware accepts a token minted for only one of them, so
  # these two strings have to stay character-identical.
  _AGENT_MIDDLEWARE_DISPATCH_ENABLED: "true"
  _AGENT_MIDDLEWARE_URL: "https://agent-middleware-42999994788.europe-west1.run.app"
  _AGENT_MIDDLEWARE_AUDIENCE: "https://agent-middleware-42999994788.europe-west1.run.app"
  # Which clients may have their CUSTOM-agent jobs routed to agent-engine,
  # as a comma-separated list of agentsRepoSlug (or "*").
  #
  # Separate from the agent-key map in product-mapping.ts because an agent
  # being migrated and a CLIENT being ready are different facts. Every
  # production client is granted the X agent; only the ones with engine-side
  # context (an xHandle, a strategy document) can actually run there, and the
  # rest must keep working on agent-service. Empty = nobody (production: empty until a client is deliberately cut over).
  _AGENT_ENGINE_CUSTOM_AGENT_CLIENTS: ""

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # ── 1. Pull the prep-tagged image from the PREP project's registry ─────────
  - id: pull-from-prep
    name: gcr.io/cloud-builders/docker
    args:
      - pull
      - ${_PREP_REGION}-docker.pkg.dev/${_PREP_PROJECT_ID}/${_REPO}/${_SERVICE}:${_SHA}

  # ── 2. Re-tag it into THIS (production) project's registry ─────────────────
  - id: tag-for-production
    name: gcr.io/cloud-builders/docker
    args:
      - tag
      - ${_PREP_REGION}-docker.pkg.dev/${_PREP_PROJECT_ID}/${_REPO}/${_SERVICE}:${_SHA}
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_SHA}
    waitFor: [pull-from-prep]

  # ── 3. Push into production's Artifact Registry ────────────────────────────
  - id: push-to-production
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_SHA}
    waitFor: [tag-for-production]

  # ── 4. Deploy to Cloud Run (same flags as cloudbuild.yaml's deploy step) ───
  - id: cloud-run-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=3000
      - --min-instances=1
      - --max-instances=10
      - --memory=1Gi
      - --cpu=1
      - --timeout=300
      - --concurrency=80
      - --set-secrets=KAROS_STAFF_KEY=KAROS_STAFF_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,RESEND_API_KEY=RESEND_API_KEY:latest,FIREFLIES_API_KEY=FIREFLIES_API_KEY:latest,FIREFLIES_WEBHOOK_SECRET=FIREFLIES_WEBHOOK_SECRET:latest,FIREBASE_SERVICE_ACCOUNT_KEY=FIREBASE_SERVICE_ACCOUNT_KEY:latest,CRON_SECRET=CRON_SECRET:latest,AGENT_SERVICE_TOKEN=agent-service-tokens:latest,AGENT_WEBHOOK_SECRET=agent-webhook-secret:latest,SEGMIND_API_KEY=SEGMIND_API_KEY:latest,NEXT_PUBLIC_FIREBASE_API_KEY=NEXT_PUBLIC_FIREBASE_API_KEY:latest,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:latest,NEXT_PUBLIC_FIREBASE_PROJECT_ID=NEXT_PUBLIC_FIREBASE_PROJECT_ID:latest,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:latest,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:latest,NEXT_PUBLIC_FIREBASE_APP_ID=NEXT_PUBLIC_FIREBASE_APP_ID:latest,AGENTS_REPO_GITHUB_TOKEN=github-token:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,OAUTH_STATE_SECRET=OAUTH_STATE_SECRET:latest,LINKEDIN_CLIENT_ID=LINKEDIN_CLIENT_ID:latest,LINKEDIN_CLIENT_SECRET=LINKEDIN_CLIENT_SECRET:latest,TWITTER_CLIENT_ID=TWITTER_CLIENT_ID:latest,TWITTER_CLIENT_SECRET=TWITTER_CLIENT_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,TIKTOK_CLIENT_SECRET=TIKTOK_CLIENT_SECRET:latest,TIKTOK_CLIENT_KEY=TIKTOK_CLIENT_KEY:latest,TOKEN_ENCRYPTION_KEY=TOKEN_ENCRYPTION_KEY:latest,LINKEDIN_COMMUNITY_CLIENT_SECRET=LINKEDIN_COMMUNITY_CLIENT_SECRET:latest,LINKEDIN_COMMUNITY_CLIENT_ID=LINKEDIN_COMMUNITY_CLIENT_ID:latest
      - --set-env-vars=EMAIL_FROM=${_EMAIL_FROM},ADMIN_EMAIL=${_ADMIN_EMAIL},ADMIN_EMAILS=${_ADMIN_EMAILS},NODE_ENV=production,AGENT_SERVICE_URL=${_AGENT_SERVICE_URL},AGENT_SERVICE_AUDIENCE=${_AGENT_SERVICE_URL},AGENT_SERVICE_CALLBACK_URL=${_AGENT_SERVICE_CALLBACK_URL},APP_URL=${_APP_URL},RUNWAY_AUTOGEN_ENABLED=${_RUNWAY_AUTOGEN_ENABLED},RUNWAY_MAX_JOBS_PER_CLIENT=${_RUNWAY_MAX_JOBS_PER_CLIENT},TASKMAP_AUTOGEN_ENABLED=${_TASKMAP_AUTOGEN_ENABLED},TASKMAP_AUTOGEN_SWEEP_CAP=${_TASKMAP_AUTOGEN_SWEEP_CAP},ANALYTICS_LIVE_INGEST=${_ANALYTICS_LIVE_INGEST},GCS_MEDIA_BUCKET=${_GCS_MEDIA_BUCKET},FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID},AGENT_ENGINE_DISPATCH_ENABLED=${_AGENT_ENGINE_DISPATCH_ENABLED},AGENT_MIDDLEWARE_DISPATCH_ENABLED=${_AGENT_MIDDLEWARE_DISPATCH_ENABLED},AGENT_MIDDLEWARE_URL=${_AGENT_MIDDLEWARE_URL},AGENT_MIDDLEWARE_AUDIENCE=${_AGENT_MIDDLEWARE_AUDIENCE},AGENT_ENGINE_CUSTOM_AGENT_CLIENTS=${_AGENT_ENGINE_CUSTOM_AGENT_CLIENTS}
    waitFor: [push-to-production]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_SHA}
