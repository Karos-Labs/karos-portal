Port 8888
Timeout 600
MaxClients 64
LogLevel Notice

# Only the internal job network can use the proxy
Allow 0.0.0.0/0

# Domain allowlist: everything not matching proxy-filter.txt is denied
Filter "/etc/tinyproxy/proxy-filter.txt"
FilterType ere
FilterDefaultDeny Yes

# HTTPS tunnelling only on 443
ConnectPort 443
