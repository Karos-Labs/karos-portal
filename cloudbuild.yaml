# ─────────────────────────────────────────────────────────────────────────────
# Karos CMO — build image → push to Artifact Registry → deploy to Cloud Run.
#
# This file is environment-agnostic: it's invoked once per environment,
# pointed at a different GCP project each time, with different substitution
# values. The automatic path is GitHub Actions, not a GCP-side trigger — see
# .github/workflows/deploy-prep.yml (auto, on push to main → prep project) and
# DEPLOY_ENVIRONMENTS.md (full two-environment runbook, incl. production,
# which is promoted from the built prep image via cloudbuild.promote.yaml
# rather than rebuilt from this file).
#
# One-time setup per project (run these in your terminal before first deploy):
#
#   # 1. Enable required APIs
#   gcloud services enable \
#     run.googleapis.com \
#     cloudbuild.googleapis.com \
#     artifactregistry.googleapis.com \
#     secretmanager.googleapis.com
#
#   # 2. Create the Artifact Registry repository
#   gcloud artifacts repositories create karos-cmo \
#     --repository-format=docker \
#     --location=$_REGION
#
#   # 3. Grant Cloud Build SA permission to deploy to Cloud Run
#   PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
#   gcloud projects add-iam-policy-binding $PROJECT_ID \
#     --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#     --role="roles/run.admin"
#   gcloud iam service-accounts add-iam-policy-binding \
#     "${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
#     --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#     --role="roles/iam.serviceAccountUser"
#
#   # 4. Grant Cloud Build SA permission to read secrets (for server-side runtime secrets)
#   gcloud projects add-iam-policy-binding $PROJECT_ID \
#     --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#     --role="roles/secretmanager.secretAccessor"
#
#   # 5. Store server-side runtime secrets in Secret Manager
#   echo -n "sk_..." | gcloud secrets create KAROS_STAFF_KEY --data-file=-
#   echo -n "sk-ant-..." | gcloud secrets create ANTHROPIC_API_KEY --data-file=-
#   echo -n "re_..." | gcloud secrets create RESEND_API_KEY --data-file=-
#   echo -n "..." | gcloud secrets create FIREFLIES_API_KEY --data-file=-
#   echo -n "..." | gcloud secrets create FIREFLIES_WEBHOOK_SECRET --data-file=-
#   cat serviceAccount.json | gcloud secrets create FIREBASE_SERVICE_ACCOUNT_KEY --data-file=-
#
#   # Note: NEXT_PUBLIC_FIREBASE_* are public Firebase Web SDK config — public
#   # in the sense that they're safe to ship in the browser bundle, not in the
#   # sense that they're exempt from this repo's "no committed env values"
#   # rule. They live in Secret Manager like everything else (shared by every
#   # environment, since prep and production point at the same Firebase
#   # project) and the docker-build step below reads them at build time via
#   # --build-arg, since Next.js only inlines NEXT_PUBLIC_* into the client
#   # bundle from build-time ENV, not from a runtime Cloud Run env var.
#   echo -n "AIza..." | gcloud secrets create NEXT_PUBLIC_FIREBASE_API_KEY --data-file=-
#   echo -n "project.firebaseapp.com" | gcloud secrets create NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN --data-file=-
#   echo -n "project-id" | gcloud secrets create NEXT_PUBLIC_FIREBASE_PROJECT_ID --data-file=-
#   echo -n "project.firebasestorage.app" | gcloud secrets create NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET --data-file=-
#   echo -n "123456789" | gcloud secrets create NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID --data-file=-
#   echo -n "1:123456789:web:abc" | gcloud secrets create NEXT_PUBLIC_FIREBASE_APP_ID --data-file=-
#
#   # 6. No GCP-side Cloud Build trigger is created — GitHub Actions is the
#   #    automatic path (deploy-prep.yml on push to main; promote-production.yml
#   #    is the manual production gate). Grant the deployer service account
#   #    roles/cloudbuild.builds.editor on this project so it can submit builds.
#   #    Full runbook: DEPLOY_ENVIRONMENTS.md.
#
# ── Workload Identity (recommended — avoids storing the SA key) ───────────────
# Instead of FIREBASE_SERVICE_ACCOUNT_KEY, bind the Cloud Run service account
# to the Firebase project. The firebase/admin.ts ADC path handles this automatically.
#
#   SA_EMAIL="karos-cmo-run@${PROJECT_ID}.iam.gserviceaccount.com"
#   gcloud iam service-accounts create karos-cmo-run --display-name "Karos CMO Cloud Run"
#   gcloud projects add-iam-policy-binding $PROJECT_ID \
#     --member="serviceAccount:${SA_EMAIL}" \
#     --role="roles/datastore.user"
#   gcloud projects add-iam-policy-binding $PROJECT_ID \
#     --member="serviceAccount:${SA_EMAIL}" \
#     --role="roles/firebase.sdkAdminServiceAgent"
#   # Then pass --service-account=$SA_EMAIL in the Cloud Run deploy step below
#   # and remove FIREBASE_SERVICE_ACCOUNT_KEY from the --set-secrets list.
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  _REGION: us-central1
  _REPO: karos-cmo
  _SERVICE: karos-cmo
  # Set after the agent service is deployed. Empty ⇒ the three submit cores
  # (submit-managed.ts, submit-custom.ts, run-custom-agent.ts) refuse before a job
  # row exists or credits are charged, and the run control renders disabled:
  _AGENT_SERVICE_URL: ""
  _APP_URL: ""
  # Runway autopilot (src/app/api/runway) — off by default. Flip to "1" at the
  # trigger level once a dryRun=1 sweep looks right in production.
  _RUNWAY_AUTOGEN_ENABLED: ""
  # Per client, per sweep. MUST cover a full first fill: one managed run yields
  # one asset, so a client who starts empty is 14 days short and needs 14
  # dispatches to reach the horizon. This said "2" — the exact behaviour
  # Albert's 2026-07-28 ruling removed from the code ("first sweep fills the
  # FULL 14-day buffer, dispatch the whole deficit, not 1 job; steady state =
  # weekly sweeps top up ~7"). The code default is already right
  # (RUNWAY_MAX_JOBS_DEFAULT = RUNWAY_HORIZON_DAYS in src/lib/runway.ts), but
  # this substitution is passed as an env var on every deploy and overrides it,
  # so the deficit-of-10-gets-2 bug would have come back from config the moment
  # _RUNWAY_AUTOGEN_ENABLED was flipped to "1".
  # Keep in step with RUNWAY_HORIZON_DAYS; runway.test.ts pins the two together.
  _RUNWAY_MAX_JOBS_PER_CLIENT: "14"
  # Task Map autopilot (src/app/api/tasks/auto-generate) — off by default, same
  # convention as runway above. Flip to "1" once a dryRun=1 sweep looks right.
  _TASKMAP_AUTOGEN_ENABLED: ""
  # How many clients one sweep may actually run the (expensive, ~120s) swarm
  # debate for. A client not reached this round is eligible again next run —
  # this bounds the ROUTE's own maxDuration, not overall coverage.
  _TASKMAP_AUTOGEN_SWEEP_CAP: "3"
  # Per-environment sender identity — override for prep so test sends never
  # look like production mail (see DEPLOY_ENVIRONMENTS.md).
  _EMAIL_FROM: "Karos Labs <donotreply@karoslabs.com>"
  _ADMIN_EMAIL: "hello@karoslabs.com"
  # Failure-alert on-call list (job-alerts.ts) — separate from _ADMIN_EMAIL
  # above (support/signup mail). If this ever needs more than one address,
  # note gcloud's --set-env-vars splits on every comma, so a literal
  # "a@x.com,b@y.com" value here breaks the parse unless the whole
  # --set-env-vars argument switches to a custom delimiter (--set-env-vars=^;^...).
  _ADMIN_EMAILS: "hello@karoslabs.com"
  # Set to "true" for environments where allUsers invoker is allowed (production).
  # Prep sets this to "false" via deploy-prep.yml to skip the IAM binding attempt
  # that fails under org policy constraints/iam.allowedPolicyMemberDomains.
  _ALLOW_UNAUTHENTICATED: "true"
  # Named Firestore database — prep runs its own isolated "prep" database in
  # the same shared Firebase project; "(default)" is production's. See
  # src/lib/firebase/admin.ts (FIRESTORE_DATABASE_ID) and firebase.json.
  _FIRESTORE_DATABASE_ID: "(default)"
  # Dedicated GCS bucket for large pre-generated media (src/lib/gcs-media.ts)
  # — own bucket per environment so prep media never lands in production's.
  _GCS_MEDIA_BUCKET: "karos-media-assets"
  # Agent-engine WORKSPACE bucket (src/lib/agent-engine/workspace-writer.ts) —
  # the reconcile cron mirrors client knowledge into it. Empty = sync skipped;
  # prep overrides via deploy-prep.yml (karoscmo-prep-agent-artifacts).
  _AGENT_ENGINE_WORKSPACE_BUCKET: ""
  # Live external analytics ingestion (src/lib/analytics — pulls real
  # connected-account data for whichever clients exist in this environment's
  # own Firestore database).
  _ANALYTICS_LIVE_INGEST: "1"
  # Agent-service webhook callback target — a stable Cloud Run URL for THIS
  # service (independent of _APP_URL/any custom domain). Set once this
  # environment's own agent-service is deployed.
  _AGENT_SERVICE_CALLBACK_URL: ""
  # agent-engine dispatch (src/lib/agent-engine/dispatch.ts). Production has
  # been running with this on since 2026-08; it lived only on the running
  # revision, so the next promote would have silently switched it back off —
  # --set-env-vars replaces the whole set. It belongs here for that reason.
  _AGENT_ENGINE_DISPATCH_ENABLED: "true"
  # Route dispatch through the agent-middleware control plane instead of
  # publishing straight to Pub/Sub. Deliberately EMPTY here (= off), because
  # cloudbuild.yaml's defaults are production's and agent-middleware is not
  # provisioned in karoscmo yet. deploy-prep.yml overrides all three for prep.
  #
  # These are per-environment and must never be crossed: the middleware
  # resolves prompt and template versions out of its own environment's
  # Firestore, so a production job pointed at prep's control plane would run
  # against prep's unreviewed prompts. When prod is provisioned, set these to
  # prod's own service URL, not prep's.
  _AGENT_MIDDLEWARE_DISPATCH_ENABLED: ""
  _AGENT_MIDDLEWARE_URL: ""
  # The OIDC audience the caller mints its token for. Must equal the receiving
  # service's AUTH_AUDIENCE exactly — Cloud Run publishes a service on two URL
  # forms and the middleware only accepts the one it was configured with.
  _AGENT_MIDDLEWARE_AUDIENCE: ""
  # Which clients may have their CUSTOM-agent jobs routed to agent-engine,
  # as a comma-separated list of agentsRepoSlug (or "*").
  #
  # Separate from the agent-key map in product-mapping.ts because an agent
  # being migrated and a CLIENT being ready are different facts. Every
  # production client is granted the X agent; only the ones with engine-side
  # context (an xHandle, a strategy document) can actually run there, and the
  # rest must keep working on agent-service. Empty = nobody (prep overrides this via deploy-prep.yml).
  _AGENT_ENGINE_CUSTOM_AGENT_CLIENTS: ""
  # agent-engine direct dispatch. PUBSUB_TOPIC is what
  # isAgentEnginePubSubConfigured() checks, and it is the fallback transport
  # when the control plane cannot service a dispatch -- without it a
  # middleware outage fails every job instead of degrading to a direct
  # publish. It was missing from BOTH deploy configs and from the prep
  # service entirely, so prep's fallback has been inert; production had it
  # only as a hand-set variable, which the 2026-08-22 promote then deleted.
  _AGENT_ENGINE_PUBSUB_TOPIC: ""
  _AGENT_ENGINE_URL: ""
  _AGENT_ENGINE_AUDIENCE: ""
  # Full production/prep parity — the rest of these were previously only in
  # cloudbuild.promote.yaml (production). Same secret NAMES everywhere, own
  # VALUES per project's Secret Manager (see DEPLOY_ENVIRONMENTS.md).
  # Override at submit time: --substitutions _REGION=europe-west1,...

# Build-time-only secrets — the docker-build step's own secretEnv pulls these
# in so NEXT_PUBLIC_FIREBASE_* can be inlined into the client bundle at
# `next build`. Every other secret above is a Cloud Run RUNTIME secret
# (--set-secrets on the deploy step) and has no reason to be listed here.
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_API_KEY/versions/latest
      env: NEXT_PUBLIC_FIREBASE_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN/versions/latest
      env: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_PROJECT_ID/versions/latest
      env: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET/versions/latest
      env: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_APP_ID/versions/latest
      env: NEXT_PUBLIC_FIREBASE_APP_ID

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8   # faster builds; Next.js compilation is CPU-bound

steps:
  # ── 1. Build the Docker image ───────────────────────────────────────────────
  # NEXT_PUBLIC_FIREBASE_* are public Firebase Web SDK config, but read from
  # Secret Manager like every other env value (never committed) via this
  # step's own secretEnv, and passed through as --build-arg — Next.js only
  # inlines NEXT_PUBLIC_* from build-time ENV, so these can't be deferred to
  # the Cloud Run --set-secrets deploy step below.
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - NEXT_PUBLIC_FIREBASE_API_KEY
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
      - NEXT_PUBLIC_FIREBASE_APP_ID
    args:
      - -c
      - |
        docker build \
          --cache-from ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest \
          --tag ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA \
          --tag ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$$NEXT_PUBLIC_FIREBASE_API_KEY" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$$NEXT_PUBLIC_FIREBASE_PROJECT_ID" \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$$NEXT_PUBLIC_FIREBASE_APP_ID" \
          .

  # ── 2. Push both tags to Artifact Registry ──────────────────────────────────
  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}
    waitFor: [docker-build]

  # ── 3. Deploy to Cloud Run ──────────────────────────────────────────────────
  - id: cloud-run-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        AUTH_FLAG="--allow-unauthenticated"
        if [ "${_ALLOW_UNAUTHENTICATED}" != "true" ]; then
          AUTH_FLAG="--no-allow-unauthenticated"
        fi
        gcloud run deploy ${_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          $$AUTH_FLAG \
          --port=3000 \
          --min-instances=1 \
          --max-instances=10 \
          --memory=1Gi \
          --cpu=1 \
          --timeout=300 \
          --concurrency=80 \
          --set-secrets=KAROS_STAFF_KEY=KAROS_STAFF_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,RESEND_API_KEY=RESEND_API_KEY:latest,FIREFLIES_API_KEY=FIREFLIES_API_KEY:latest,FIREFLIES_WEBHOOK_SECRET=FIREFLIES_WEBHOOK_SECRET:latest,FIREBASE_SERVICE_ACCOUNT_KEY=FIREBASE_SERVICE_ACCOUNT_KEY:latest,CRON_SECRET=CRON_SECRET:latest,AGENT_SERVICE_TOKEN=agent-service-tokens:latest,AGENT_WEBHOOK_SECRET=agent-webhook-secret:latest,SEGMIND_API_KEY=SEGMIND_API_KEY:latest,NEXT_PUBLIC_FIREBASE_API_KEY=NEXT_PUBLIC_FIREBASE_API_KEY:latest,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:latest,NEXT_PUBLIC_FIREBASE_PROJECT_ID=NEXT_PUBLIC_FIREBASE_PROJECT_ID:latest,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:latest,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:latest,NEXT_PUBLIC_FIREBASE_APP_ID=NEXT_PUBLIC_FIREBASE_APP_ID:latest,AGENTS_REPO_GITHUB_TOKEN=github-token:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,OAUTH_STATE_SECRET=OAUTH_STATE_SECRET:latest,LINKEDIN_CLIENT_ID=LINKEDIN_CLIENT_ID:latest,LINKEDIN_CLIENT_SECRET=LINKEDIN_CLIENT_SECRET:latest,TWITTER_CLIENT_ID=TWITTER_CLIENT_ID:latest,TWITTER_CLIENT_SECRET=TWITTER_CLIENT_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,TIKTOK_CLIENT_SECRET=TIKTOK_CLIENT_SECRET:latest,TIKTOK_CLIENT_KEY=TIKTOK_CLIENT_KEY:latest,TOKEN_ENCRYPTION_KEY=TOKEN_ENCRYPTION_KEY:latest,LINKEDIN_COMMUNITY_CLIENT_SECRET=LINKEDIN_COMMUNITY_CLIENT_SECRET:latest,LINKEDIN_COMMUNITY_CLIENT_ID=LINKEDIN_COMMUNITY_CLIENT_ID:latest \
          --set-env-vars="EMAIL_FROM=${_EMAIL_FROM},ADMIN_EMAIL=${_ADMIN_EMAIL},ADMIN_EMAILS=${_ADMIN_EMAILS},NODE_ENV=production,AGENT_SERVICE_URL=${_AGENT_SERVICE_URL},AGENT_SERVICE_AUDIENCE=${_AGENT_SERVICE_URL},AGENT_SERVICE_CALLBACK_URL=${_AGENT_SERVICE_CALLBACK_URL},APP_URL=${_APP_URL},RUNWAY_AUTOGEN_ENABLED=${_RUNWAY_AUTOGEN_ENABLED},RUNWAY_MAX_JOBS_PER_CLIENT=${_RUNWAY_MAX_JOBS_PER_CLIENT},TASKMAP_AUTOGEN_ENABLED=${_TASKMAP_AUTOGEN_ENABLED},TASKMAP_AUTOGEN_SWEEP_CAP=${_TASKMAP_AUTOGEN_SWEEP_CAP},FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID},GCS_MEDIA_BUCKET=${_GCS_MEDIA_BUCKET},ANALYTICS_LIVE_INGEST=${_ANALYTICS_LIVE_INGEST},GOOGLE_CLOUD_PROJECT=$PROJECT_ID,AGENT_ENGINE_DISPATCH_ENABLED=${_AGENT_ENGINE_DISPATCH_ENABLED},AGENT_MIDDLEWARE_DISPATCH_ENABLED=${_AGENT_MIDDLEWARE_DISPATCH_ENABLED},AGENT_MIDDLEWARE_URL=${_AGENT_MIDDLEWARE_URL},AGENT_MIDDLEWARE_AUDIENCE=${_AGENT_MIDDLEWARE_AUDIENCE},AGENT_ENGINE_CUSTOM_AGENT_CLIENTS=${_AGENT_ENGINE_CUSTOM_AGENT_CLIENTS},AGENT_ENGINE_PUBSUB_TOPIC=${_AGENT_ENGINE_PUBSUB_TOPIC},AGENT_ENGINE_URL=${_AGENT_ENGINE_URL},AGENT_ENGINE_AUDIENCE=${_AGENT_ENGINE_AUDIENCE},AGENT_ENGINE_WORKSPACE_BUCKET=${_AGENT_ENGINE_WORKSPACE_BUCKET}"
    waitFor: [docker-push]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
