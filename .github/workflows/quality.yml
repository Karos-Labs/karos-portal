name: Quality checks

# Reusable workflow — the single source of truth for "does this commit pass
# lint/type-check/tests/env-inventory". Called by ci.yml (PR/push status
# checks) and by deploy-prep.yml (which gates the prep deploy on the same
# checks).
on:
  workflow_call:

jobs:
  quality:
    name: Type-check · Lint · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run test suite
        run: npm test

      # SCRUM-332 (AU49) — Deliverable 3: fails the build when a variable the
      # code reads (direct or through this repo's two indirection patterns —
      # see scripts/lib/env-inventory-core.ts's header comment) is missing
      # from .env.example. wired-but-never-read only warns (printed in this
      # step's own output, does not affect its exit code) until the
      # indirection resolution has proven itself over a few releases.
      - name: Env inventory (read-but-undocumented must be empty)
        run: npx tsx scripts/env-inventory.ts

      # THE GATE THAT WAS MISSING. This pipeline type-checks, lints, tests and
      # inventories env vars, and never once looked at what it was shipping:
      # the tree was on a Next release carrying a middleware/proxy BYPASS
      # advisory — an authorization-bypass primitive in an app whose entire
      # authz model is in-process — for as long as it took someone to run
      # `npm audit` by hand.
      #
      # `--omit=dev` because this asks what PRODUCTION ships; a dev-only
      # advisory is real but is not a deployed risk and must not block a
      # release. `--audit-level=high` because the five moderates left in the
      # tree today are all one transitive chain whose only fix is
      # `@google-cloud/storage` v8 — a semver-major upgrade that deserves its
      # own change, not a red build on every unrelated PR. Lower the level in
      # the same commit that takes that major.
      - name: Dependency audit (production tree, high and critical fail)
        run: npm audit --omit=dev --audit-level=high
