name: Deploy Agent Service (Prep)

# Automatic path: every push to main touching agent-service/** is built and
# deployed to prep's OWN agent-service (separate from production's — prep
# now has full production parity, including its own agent-service deployment
# in karoscmo-prep, its own Redis/VPC connector/egress proxy/artifacts
# bucket). No approval gate, matching deploy-prep.yml's automatic nature —
# production's agent-service only ever deploys manually (deploy-agent-service.yml).
#
# One-time setup (run once per DEPLOY_ENVIRONMENTS.md's prep-agent-service
# runbook before the first push that touches agent-service/**):
#   PROJECT_ID=karoscmo-prep REGION=us-central1 \
#   PLATFORM_SA=<prep's platform Cloud Run runtime SA> \
#     ./agent-service/deploy/bootstrap-gcp.sh
on:
  push:
    branches: [main]
    paths:
      - "agent-service/**"
  workflow_dispatch:
    inputs:
      agents_ref:
        description: "karos-agents git ref to bake into the runner image (blank = main)"
        required: false

concurrency:
  group: deploy-agent-service-prep
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    name: Agent service · Type-check · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: agent-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run typecheck

      - name: Run test suite
        run: npm test

  deploy:
    name: Build & deploy agent-service (prep)
    needs: quality
    runs-on: ubuntu-latest
    environment: prep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # PREP_AGENT_SERVICE_URL is NOT required here — it's this deploy's own
      # output (Cloud Run assigns it), so it's unknown on the very first run.
      # It's passed as _INTERNAL_API_URL below and simply blank until you set
      # it after this first deploy succeeds (see DEPLOY_ENVIRONMENTS.md);
      # re-run this workflow afterward so the worker picks it up.
      - name: Validate required repo variables
        run: |
          missing=()
          for v in PREP_PROJECT_ID; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repo variable(s): ${missing[*]}"
            exit 1
          fi
        env:
          PREP_PROJECT_ID: ${{ vars.PREP_PROJECT_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set active project (fixes quota-project resolution for GCS uploads)
        run: gcloud config set project "${{ vars.PREP_PROJECT_ID }}"

      # The runner job's only route out is this egress proxy VM (see
      # agent-service/deploy/bootstrap-gcp.sh + proxy-startup.sh) — its
      # internal IP is looked up live rather than pinned in a repo variable,
      # since gcloud run deploy --set-env-vars replaces the full env-var set
      # on every deploy and a stale cached IP would silently misroute egress.
      - name: Resolve egress proxy internal IP
        id: proxy
        run: |
          PROXY_IP=$(gcloud compute instances list \
            --project="${{ vars.PREP_PROJECT_ID }}" \
            --filter="name=agent-egress-proxy" \
            --format="value(networkInterfaces[0].networkIP)")
          if [ -z "$PROXY_IP" ]; then
            echo "::error::Could not find the agent-egress-proxy VM in ${{ vars.PREP_PROJECT_ID }} — has agent-service/deploy/bootstrap-gcp.sh been run for prep yet?"
            exit 1
          fi
          echo "ip=$PROXY_IP" >> "$GITHUB_OUTPUT"

      # karoscmo-prep's own default <PROJECT_ID>_cloudbuild staging bucket
      # already works (created + IAM-granted earlier for the platform's own
      # prep deploys) — no dedicated staging bucket needed here, unlike
      # production's legacy bucket workaround in deploy-agent-service.yml.
      - name: Build & deploy via Cloud Build
        run: |
          gcloud builds submit \
            --project="${{ vars.PREP_PROJECT_ID }}" \
            --config=agent-service/cloudbuild.yaml \
            --substitutions=COMMIT_SHA="${{ github.sha }}",_REGION="${{ vars.PREP_REGION || 'us-central1' }}",_INTERNAL_API_URL="${{ vars.PREP_AGENT_SERVICE_URL }}",_JOB_HTTP_PROXY="http://${{ steps.proxy.outputs.ip }}:8888",_AGENTS_REF="${{ inputs.agents_ref || 'main' }}"
