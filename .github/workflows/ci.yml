name: CI

# Status checks for PRs and pushes. Deploys live in deploy-prep.yml /
# promote-production.yml, which call the same reusable quality.yml so the gate
# is identical everywhere.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    uses: ./.github/workflows/quality.yml
