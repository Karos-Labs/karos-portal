name: Promote to Production

# Manual only. Never triggered by a push or by prep succeeding — the only way
# this runs is a human clicking "Run workflow" in the Actions tab (or
# `gh workflow run promote-production.yml`). Leave the sha input blank to
# promote whatever is currently on the tip of main (the same commit that was
# just auto-deployed to prep); pass a specific sha to promote an older,
# already-verified prep build instead.
#
# Does NOT rebuild from source: copies the exact image already built and
# deployed to prep into production's own Artifact Registry, then deploys
# that image. What you approved in prep is byte-for-byte what ships.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to promote (leave blank for latest main)"
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    name: Promote prep image → production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Resolve SHA
        id: sha
        run: |
          SHA="${{ inputs.sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Promoting SHA: $SHA"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - name: Validate required repo variables
        run: |
          missing=()
          for v in PROD_PROJECT_ID PROD_REGION PROD_APP_URL PREP_PROJECT_ID; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repo variable(s): ${missing[*]} — refusing to deploy to production with an incomplete config."
            exit 1
          fi
        env:
          PROD_PROJECT_ID: ${{ vars.PROD_PROJECT_ID }}
          PROD_REGION: ${{ vars.PROD_REGION }}
          PROD_APP_URL: ${{ vars.PROD_APP_URL }}
          PREP_PROJECT_ID: ${{ vars.PREP_PROJECT_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # cloudbuild.promote.yaml copies the prep-tagged image into production's
      # own Artifact Registry (no rebuild) and deploys it to Cloud Run.
      - name: Copy image & deploy via Cloud Build
        run: |
          gcloud builds submit \
            --project="${{ vars.PROD_PROJECT_ID }}" \
            --config=cloudbuild.promote.yaml \
            --no-source \
            --substitutions=_REGION="${{ vars.PROD_REGION }}",_PREP_PROJECT_ID="${{ vars.PREP_PROJECT_ID }}",_PREP_REGION="${{ vars.PREP_REGION || 'us-central1' }}",_SHA="${{ steps.sha.outputs.sha }}",_APP_URL="${{ vars.PROD_APP_URL }}",_AGENT_SERVICE_URL="${{ vars.PROD_AGENT_SERVICE_URL }}",_EMAIL_FROM="${{ vars.PROD_EMAIL_FROM }}",_ADMIN_EMAIL="${{ vars.PROD_ADMIN_EMAIL }}",_ADMIN_EMAILS="${{ vars.PROD_ADMIN_EMAILS }}"
