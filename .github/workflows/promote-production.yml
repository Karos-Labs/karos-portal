name: Promote to Production

# Triggers automatically after every successful prep deploy, then pauses for
# a human approval before touching production. The approval gate lives on the
# "production" GitHub Environment — configure required reviewers at:
#   Settings → Environments → production → Deployment protection rules
#
# For an emergency manual promote, use workflow_dispatch (SHA defaults to
# the latest commit on main if left blank).
on:
  workflow_run:
    workflows: ["Deploy to Prep"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to promote (leave blank for latest main)"
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    name: Promote prep image → production
    # For workflow_run: only proceed when prep actually succeeded.
    # For workflow_dispatch: always proceed (manual caller decides).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production   # ← approval gate; add required reviewers in repo settings

    steps:
      - name: Resolve SHA
        id: sha
        run: |
          SHA="${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Promoting SHA: $SHA"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - name: Validate required repo variables
        run: |
          missing=()
          for v in PROD_PROJECT_ID PROD_REGION PROD_APP_URL PREP_PROJECT_ID; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repo variable(s): ${missing[*]} — refusing to deploy to production with an incomplete config."
            exit 1
          fi
        env:
          PROD_PROJECT_ID: ${{ vars.PROD_PROJECT_ID }}
          PROD_REGION: ${{ vars.PROD_REGION }}
          PROD_APP_URL: ${{ vars.PROD_APP_URL }}
          PREP_PROJECT_ID: ${{ vars.PREP_PROJECT_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # cloudbuild.promote.yaml copies the prep-tagged image into production's
      # own Artifact Registry (no rebuild) and deploys it to Cloud Run.
      - name: Copy image & deploy via Cloud Build
        run: |
          gcloud builds submit \
            --project="${{ vars.PROD_PROJECT_ID }}" \
            --config=cloudbuild.promote.yaml \
            --no-source \
            --substitutions=_REGION="${{ vars.PROD_REGION }}",_PREP_PROJECT_ID="${{ vars.PREP_PROJECT_ID }}",_PREP_REGION="${{ vars.PREP_REGION || 'us-central1' }}",_SHA="${{ steps.sha.outputs.sha }}",_APP_URL="${{ vars.PROD_APP_URL }}",_AGENT_SERVICE_URL="${{ vars.PROD_AGENT_SERVICE_URL }}",_EMAIL_FROM="${{ vars.PROD_EMAIL_FROM }}",_ADMIN_EMAIL="${{ vars.PROD_ADMIN_EMAIL }}"
