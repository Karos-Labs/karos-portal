name: Deploy to Prep

# Automatic path: every push to main that passes quality checks is built and
# deployed to the prep Cloud Run service (separate GCP project from
# production — see DEPLOY_ENVIRONMENTS.md). Production is never touched here;
# promoting a verified prep build to production is a separate manual workflow
# (promote-production.yml).
#
# Prep now has full production feature parity with its own "basics": its own
# named Firestore database ("prep", same shared Firebase project — see
# firebase.json + src/lib/firebase/admin.ts), its own GCS media bucket, and
# its own agent-service deployment (see deploy-agent-service-prep.yml). Auth
# users are still shared (same Firebase project); Firestore data is not.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-prep
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation — no service-account key needed

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    name: Build & deploy (prep)
    needs: quality
    runs-on: ubuntu-latest
    environment: prep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Reuses the existing build+push+deploy recipe in cloudbuild.yaml,
      # unchanged, just pointed at the prep project with prep substitutions.
      # Cloud Build itself does the docker build (fast machine type, separate
      # from the GitHub-hosted runner).
      #
      # _RUNTIME_SERVICE_ACCOUNT (AU58 / SCRUM-357) is set HERE, not as a
      # default in cloudbuild.yaml: that file is environment-agnostic by
      # construction (see its header) and is also the file production is built
      # from, so a prep-specific identity baked in as its default would follow
      # the image into every other environment. The dedicated SA is a property
      # of the prep deployment, so it is named by the prep deployment.
      #
      # Hardcoded with a vars override, matching how
      # _AGENT_ENGINE_WORKSPACE_BUCKET is wired — the value is a fixed,
      # already-provisioned prep resource, so requiring a GitHub var to be set
      # before the deploy works just adds a way to silently fall back to the
      # shared default compute SA.
      - name: Build & deploy via Cloud Build
        run: |
          gcloud builds submit \
            --project="${{ vars.PREP_PROJECT_ID }}" \
            --config=cloudbuild.yaml \
            --substitutions=COMMIT_SHA="${{ github.sha }}",_REGION="${{ vars.PREP_REGION || 'us-central1' }}",_APP_URL="${{ vars.PREP_APP_URL }}",_AGENT_SERVICE_URL="${{ vars.PREP_AGENT_SERVICE_URL }}",_EMAIL_FROM="${{ vars.PREP_EMAIL_FROM }}",_ADMIN_EMAIL="${{ vars.PREP_ADMIN_EMAIL }}",_ADMIN_EMAILS="${{ vars.PREP_ADMIN_EMAILS }}",_FIRESTORE_DATABASE_ID="prep",_GCS_MEDIA_BUCKET="${{ vars.PREP_GCS_MEDIA_BUCKET }}",_AGENT_SERVICE_CALLBACK_URL="${{ vars.PREP_APP_URL }}",_AGENT_MIDDLEWARE_DISPATCH_ENABLED="${{ vars.PREP_AGENT_MIDDLEWARE_DISPATCH_ENABLED }}",_AGENT_MIDDLEWARE_URL="${{ vars.PREP_AGENT_MIDDLEWARE_URL }}",_AGENT_MIDDLEWARE_AUDIENCE="${{ vars.PREP_AGENT_MIDDLEWARE_URL }}",_AGENT_ENGINE_CUSTOM_AGENT_CLIENTS="${{ vars.PREP_AGENT_ENGINE_CUSTOM_AGENT_CLIENTS }}",_AGENT_ENGINE_PUBSUB_TOPIC="${{ vars.PREP_AGENT_ENGINE_PUBSUB_TOPIC }}",_AGENT_ENGINE_URL="${{ vars.PREP_AGENT_ENGINE_URL }}",_AGENT_ENGINE_AUDIENCE="${{ vars.PREP_AGENT_ENGINE_URL }}",_AGENT_ENGINE_WORKSPACE_BUCKET="${{ vars.PREP_AGENT_ENGINE_WORKSPACE_BUCKET || 'karoscmo-prep-agent-artifacts' }}",_RUNTIME_SERVICE_ACCOUNT="${{ vars.PREP_RUNTIME_SERVICE_ACCOUNT || 'karos-cmo-prep@karoscmo-prep.iam.gserviceaccount.com' }}",_CREDITS_PLAN_V2_ENABLED="${{ vars.PREP_CREDITS_PLAN_V2_ENABLED }}"
